<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Case Board</title>
<style>
  :root{color-scheme:light dark;--bg:#f1f1f1;--text:#1d1d1f;--muted:#6e6e73;--accent:#007aff}
  @media (prefers-color-scheme:dark){:root{--bg:#444444;--text:#f5f5f7;--muted:#c7c7cc;--accent:#0a84ff}}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI Variable","Segoe UI",Arial,sans-serif;display:grid;place-items:center;text-align:center}
  .box{display:grid;justify-items:center;gap:14px;padding:24px}
  .icon{width:76px;height:76px;border-radius:20px;background:linear-gradient(180deg,#4ab3f8,#0a64ff);box-shadow:0 10px 30px rgba(10,100,255,.35);animation:breathe 1.6s ease-in-out infinite}
  h1{margin:4px 0 0;font-size:22px;font-weight:700;letter-spacing:-.02em}
  p{margin:0;color:var(--muted);max-width:340px}
  button{font:inherit;font-weight:600;border:0;border-radius:999px;padding:9px 20px;background:var(--accent);color:#fff;cursor:pointer;display:none}
  .offline .icon{animation:none;filter:grayscale(.6)}
  .offline button{display:inline-block}
  @keyframes breathe{50%{transform:scale(1.06)}}
  @media (prefers-reduced-motion:reduce){.icon{animation:none}}
</style>
</head>
<body>
<div class="box" id="box">
  <div class="icon" aria-hidden="true"></div>
  <h1>Case Board</h1>
  <p id="msg">Opening your board…</p>
  <button type="button" id="retry">Try again</button>
</div>
<script>
  // The live board. Every deploy to this site reaches the app on its next launch.
  var APP_URL = "https://caseboard-hazel.vercel.app";

  var box = document.getElementById("box"), msg = document.getElementById("msg");
  function go() {
    box.classList.remove("offline"); msg.textContent = "Opening your board…";
    var done = false, timer = setTimeout(fail, 8000);
    fetch(APP_URL + "/api/version", { mode: "no-cors", cache: "no-store" })
      .then(function () { if (done) return; done = true; clearTimeout(timer); location.replace(APP_URL); })
      .catch(fail);
    function fail() {
      if (done) return; done = true; clearTimeout(timer);
      box.classList.add("offline");
      msg.textContent = "Can't reach Case Board. Check your internet connection, and it will open as soon as you're back online.";
    }
  }
  document.getElementById("retry").addEventListener("click", go);
  window.addEventListener("online", go);
  go();
</script>
</body>
</html>
