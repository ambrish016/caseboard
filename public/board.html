<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Case Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout idea: an open desk you pan and zoom, in Apple's visual language: frosted glass controls, system type, soft rounded cards, blue accent. Each page is one desk with four surfaces; folders hold cards and fan them out on hover. */
  --desk:#f2f2f7;
  --dot:rgba(0,0,0,.09);
  --glass:rgba(255,255,255,.74);
  --chip:#ffffff;
  --line:rgba(0,0,0,.1);
  --text:#1d1d1f;
  --muted:#6e6e73;
  --hover:rgba(0,0,0,.06);
  --accent:#007aff;
  --red:#ff3b30;
  --green:#248a3d;
  --orange:#b25000;
  --shadow:0 8px 28px rgba(0,0,0,.14);
  --ink:#1d1d1f;
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){color-scheme:dark;--desk:#151517;--dot:rgba(255,255,255,.08);--glass:rgba(44,44,46,.74);--chip:#2c2c2e;--line:rgba(255,255,255,.14);--text:#f5f5f7;--muted:#98989d;--hover:rgba(255,255,255,.1);--accent:#0a84ff;--red:#ff453a;--shadow:0 10px 30px rgba(0,0,0,.5)}
}
:root[data-theme="dark"]{color-scheme:dark;--desk:#151517;--dot:rgba(255,255,255,.08);--glass:rgba(44,44,46,.74);--chip:#2c2c2e;--line:rgba(255,255,255,.14);--text:#f5f5f7;--muted:#98989d;--hover:rgba(255,255,255,.1);--accent:#0a84ff;--red:#ff453a;--shadow:0 10px 30px rgba(0,0,0,.5)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--desk);color:var(--text);font:14px/1.4 var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#vp{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:default;
  background:radial-gradient(circle,var(--dot) 1px,transparent 1.5px) 0 0/28px 28px,var(--desk)}
#vp.hand{cursor:grab}#vp.panning{cursor:grabbing}#vp.placing{cursor:crosshair}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#world.swap{animation:swap .28s ease}
@keyframes swap{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){#world.swap{animation:none}.fan,.mini{transition:none!important}}

/* ---------- floating glass UI ---------- */
.ui{position:absolute;z-index:30;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);color:var(--text)}
#bar{top:14px;left:50%;transform:translateX(-50%);display:flex;gap:2px;padding:6px;max-width:calc(100% - 150px);overflow-x:auto}
.tool{background:none;border:0;border-radius:11px;padding:6px 7px 4px;min-width:48px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;font-weight:500;color:var(--muted)}
.tool:hover{background:var(--hover);color:var(--text)}
.tool.on{background:var(--accent);color:#fff}
.tool svg{width:20px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.sep{width:1px;background:var(--line);margin:6px 4px;flex:none}
.ic{width:20px;height:18px;border-radius:4px;display:block;box-shadow:0 0 0 .5px rgba(0,0,0,.25)}
.ic.note{background:#ffd426}
.ic.source{background:linear-gradient(#26262b 0 62%,#fff 62%)}
.ic.reference{background:linear-gradient(#bf5af2 0 62%,#fff 62%)}
.ic.asset{background:#e3c79c}
.ic.beat{background:linear-gradient(90deg,#ff9f0a 0 30%,#fff 30%)}
.ic.frame{background:#fff;border:2px dashed #8e8e93;box-shadow:none}
.ic.version{background:linear-gradient(#ff453a 0 42%,#fff 42%)}
.ic.style{background:#0a84ff}
.ic.folder{background:#3b9cf5;border-radius:2px 5px 4px 4px;position:relative;height:15px;margin-top:3px;box-shadow:none}
.ic.folder::before{content:"";position:absolute;left:0;top:-3px;width:9px;height:4px;background:#2f86dc;border-radius:2px 2px 0 0}
.ic.string{background:linear-gradient(135deg,transparent 44%,var(--red) 44% 56%,transparent 56%);box-shadow:none}
#hint{position:absolute;z-index:29;top:80px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--muted);text-align:center;width:min(660px,calc(100% - 32px));pointer-events:none}
#menuBtn{top:14px;left:14px;width:42px;height:42px;display:grid;place-items:center;padding:0;border-radius:13px}
#menuBtn svg{width:18px;height:18px;stroke:var(--text);stroke-width:1.8;fill:none;stroke-linecap:round}
#menu,#lib,#list{display:none;padding:8px;width:280px;max-width:calc(100% - 28px);max-height:calc(100% - 150px);overflow:auto}
#menu.show,#lib.show,#list.show{display:block}
#menu{top:64px;left:14px}
#list{top:64px;left:14px;width:300px}
#lib{top:64px;right:14px;width:330px}
.mh{font-size:11.5px;font-weight:600;color:var(--muted);margin:10px 8px 4px}
.mi{display:flex;width:100%;align-items:center;gap:8px;background:none;border:0;border-radius:9px;padding:7px 9px;text-align:left}
.mi:hover{background:var(--accent);color:#fff}
.mi.cur::after{content:"\2713";margin-left:auto;font-weight:600}
.mi.del{color:var(--red)}.mi.del:hover{background:var(--red);color:#fff}
#confirm{display:none;margin:6px;padding:10px;border:1px solid var(--line);border-radius:11px;font-size:12.5px;background:var(--hover)}
#confirm.show{display:block}
.rowb{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center}
.btn{background:var(--hover);border:0;border-radius:9px;padding:6px 12px;font-size:13px;font-weight:500}
.btn:hover{filter:brightness(.93)}
.btn.pri{background:var(--accent);color:#fff}
#right{top:14px;right:14px;display:flex;gap:8px;background:none;border:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
#right .btn{padding:10px 15px;border-radius:13px;background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);box-shadow:var(--shadow)}
#right .btn.pri{background:var(--accent);border-color:transparent}
#zoom,#pager{bottom:14px;display:flex;align-items:center;padding:4px;border-radius:13px}
#zoom{left:14px}#pager{right:14px}
#zoom button,#pager button{background:none;border:0;border-radius:9px;min-width:34px;height:32px;font-size:16px}
#zoom button:hover,#pager button:hover:not(:disabled){background:var(--hover)}
#pager button:disabled{opacity:.3;cursor:default}
#zoom #fitBtn{font-size:13px;padding:0 10px}
#zv,#pv{font-size:12.5px;font-variant-numeric:tabular-nums;min-width:52px;text-align:center}
#pv{min-width:92px;font-weight:600}
#pager .add{color:var(--accent);font-size:19px}
#next{left:50%;bottom:14px;transform:translateX(-50%);padding:9px 16px;font-size:13px;max-width:calc(100% - 420px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:999px}
#next b{color:var(--accent);font-weight:600}
#toast{left:50%;bottom:66px;transform:translateX(-50%);padding:9px 16px;font-size:13px;border-radius:999px;display:none;max-width:90%}
#toast.show{display:block}
.libitem{display:flex;gap:8px;align-items:center;padding:8px;border-bottom:1px solid var(--line)}
.libitem b{display:block;font-weight:600}
.libitem small{font:11px var(--mono);color:var(--muted);overflow-wrap:anywhere}
.libitem .btn{margin-left:auto;white-space:nowrap}
.libadd{display:grid;gap:6px;padding:8px 8px 4px}
.libadd input,.libadd select{background:var(--hover);border:1px solid var(--line);border-radius:9px;padding:7px 9px;width:100%}
.li{display:flex;align-items:center;gap:8px;padding:5px 8px}
.li input{accent-color:var(--accent);width:16px;height:16px}
.li button{background:none;border:0;padding:0;text-align:left;flex:1;min-width:0;overflow-wrap:anywhere}
.li button:hover{color:var(--accent)}
.li.d button{color:var(--muted);text-decoration:line-through}

/* ---------- page title and surfaces ---------- */
#proj{position:absolute;left:44px;top:14px;min-width:300px;max-width:1100px;font-size:38px;font-weight:800;letter-spacing:-.02em;line-height:1.15;color:var(--text);white-space:nowrap;outline:none;border-radius:10px;padding:2px 8px;margin-left:-8px;cursor:text}
#proj:focus{background:var(--hover)}
.sec{position:absolute;border-radius:26px;box-shadow:var(--shadow)}
.sec.mat{background:linear-gradient(180deg,#e2c79c,#d6b785)}
.sec.cork{background:
  radial-gradient(circle at 20% 30%,rgba(70,40,10,.22) 1px,transparent 2px) 0 0/13px 11px,
  radial-gradient(circle at 70% 60%,rgba(255,225,180,.2) 1px,transparent 2px) 0 0/17px 15px,#c0915f;
  border:10px solid #d1d1d6;box-shadow:var(--shadow),inset 0 0 14px rgba(60,30,0,.35)}
.sec.paper{background:
  linear-gradient(rgba(0,90,200,.1) 1px,transparent 1px) 0 0/100% 26px,
  linear-gradient(90deg,rgba(0,90,200,.1) 1px,transparent 1px) 0 0/26px 100%,#fbfbf8}
.sec.white{background:linear-gradient(125deg,#ffffff 0 40%,#f1f1f3 62%,#fbfbfd);border:10px solid #d1d1d6}
.label{position:absolute;z-index:2;left:20px;top:-17px;display:flex;align-items:center;gap:8px;background:var(--chip);color:var(--text);font-size:17px;font-weight:700;letter-spacing:-.01em;padding:7px 15px 7px 12px;border-radius:999px;box-shadow:0 3px 12px rgba(0,0,0,.2)}
.label::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--d)}
.label small{font-size:12.5px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.label small.full{color:#30a14e}
.sub{position:absolute;z-index:1;left:24px;bottom:14px;font-size:13px;font-weight:500;color:rgba(30,20,5,.45);pointer-events:none}

/* ---------- cards ---------- */
.card{position:absolute;z-index:3;width:200px;color:var(--ink);font:14px/1.35 var(--body);cursor:grab;user-select:none;-webkit-user-select:none;border-radius:13px;box-shadow:0 1px 2px rgba(0,0,0,.14),0 8px 18px rgba(0,0,0,.16);padding:12px}
.card.drag{cursor:grabbing;z-index:12;box-shadow:0 22px 38px rgba(0,0,0,.34);opacity:.96}
.card.sel{z-index:10;outline:3px solid var(--accent);outline-offset:3px}
.f{outline:none;overflow-wrap:anywhere;white-space:pre-wrap;border-radius:5px;min-height:1.2em;cursor:text}
.f:focus{background:rgba(0,122,255,.12);box-shadow:0 0 0 3px rgba(0,122,255,.35);user-select:text;-webkit-user-select:text}
.f:empty::before,#proj:empty::before{content:attr(data-ph);opacity:.4}
.card:not(.sel) .f:empty:not(.f-title){display:none}
.f-title{font-weight:600;font-size:15px;letter-spacing:-.01em}
.f-detail,.f-loc{font:11.5px var(--mono);margin-top:3px;opacity:.8}
.f-loc{color:#0058d0}
.f-note{font-size:12.5px;margin-top:5px;opacity:.72}
.foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}
.stamp{border:0;border-radius:999px;font-size:11px;font-weight:600;padding:3px 9px;background:rgba(60,60,67,.14);color:#48484d}
.stamp.mid{background:rgba(255,159,10,.24);color:#8a4b00}
.stamp.done{background:rgba(48,209,88,.26);color:#17662d}
.stamp.done::before{content:"\2713\00a0"}
.flag{font-size:11.5px;font-weight:600;color:#d70015}
.t-note{background:linear-gradient(180deg,#ffe262,#ffd426);width:190px;padding:14px;border-radius:6px 6px 13px 13px}
.t-note .f-title{font-size:17px;line-height:1.2;font-weight:700}
.t-note .f-note{font-size:13.5px;opacity:.75}
.t-source,.t-reference,.t-beat,.t-frame,.t-version{background:#fff}
.t-source,.t-reference{padding:8px 8px 12px}
.t-source .f-title,.t-reference .f-title,.t-source .f-loc,.t-reference .f-loc,.t-source .f-note,.t-reference .f-note,.t-source .foot,.t-reference .foot{margin-left:4px;margin-right:4px}
.shot{height:100px;margin-bottom:9px;display:flex;align-items:flex-end;padding:7px 8px;color:#fff;border-radius:8px;background:linear-gradient(160deg,#3a3a44,#111114 72%);position:relative;overflow:hidden}
.t-reference .shot{background:linear-gradient(160deg,#c77dff,#3a1a6b 78%)}
.t-reference .shot::before{content:"";position:absolute;left:50%;top:50%;margin:-11px 0 0 -7px;border:12px solid transparent;border-left:19px solid rgba(255,255,255,.9);border-right:0}
.shot .f-detail{margin:0;color:#fff;opacity:1;position:relative;z-index:1}
.t-asset{background:linear-gradient(180deg,#ecd6b1,#e0c497);padding-top:22px}
.t-asset::before{content:"";position:absolute;top:-7px;left:50%;margin-left:-8px;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8f86,#e0281f 65%);box-shadow:0 2px 4px rgba(0,0,0,.35)}
.t-beat{box-shadow:inset 7px 0 0 #ff9f0a,0 1px 2px rgba(0,0,0,.14),0 8px 18px rgba(0,0,0,.16);padding-left:20px}
.t-beat .f-detail{font:600 18px var(--mono);margin:0 0 4px;color:#b25000;opacity:1}
.box{aspect-ratio:16/9;border:2px dashed #aeaeb2;border-radius:8px;margin-bottom:9px;display:grid;place-items:center}
.box .f-detail{margin:0}
.t-version{padding:0 0 12px}
.hello{background:#ff453a;color:#fff;font-size:17px;font-weight:800;letter-spacing:.04em;padding:9px 12px 8px;border-radius:13px 13px 0 0}
.hello span{display:block;font-size:10px;font-weight:600;letter-spacing:.08em;opacity:.85}
.t-version .in{padding:10px 12px 0}
.t-version .f-title{font-size:19px;font-weight:700}
.t-style{background:linear-gradient(180deg,#2b95ff,#0a84ff);color:#fff}
.t-style .f-loc{color:#fff;text-decoration:underline}
.t-style .stamp{background:rgba(255,255,255,.24);color:#fff}

/* on-card tools */
.tools{position:absolute;left:0;bottom:calc(100% + 13px);display:none;gap:2px;padding:4px;background:var(--glass);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);white-space:nowrap;font:500 12.5px var(--body);color:var(--text);align-items:center}
.card.sel .tools{display:flex}
.tools button{background:none;border:0;border-radius:8px;padding:5px 9px}
.tools button:hover{background:var(--hover)}
.tools .rm{color:var(--red)}
.tools .col{width:18px;height:18px;border-radius:50%;padding:0;margin:0 3px;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.folder .tools{bottom:auto;top:calc(100% + 13px)}

/* ---------- folders ---------- */
.card.folder{width:230px;height:165px;padding:0;background:none;box-shadow:none;border-radius:0}
.card.folder:hover{z-index:11}
.fback{position:absolute;inset:14px 0 0 0;border-radius:6px 14px 14px 14px;background:var(--fc);filter:brightness(.8);box-shadow:0 10px 22px rgba(0,0,0,.28)}
.fback::before{content:"";position:absolute;left:0;top:-14px;width:96px;height:16px;border-radius:9px 12px 0 0;background:var(--fc)}
.peek{position:absolute;left:18px;right:18px;top:20px;height:40px}
.peek i{position:absolute;bottom:0;left:calc(var(--k)*22px);right:calc((2 - var(--k))*14px);height:calc(40px - var(--k)*9px);background:#fff;border-radius:5px 5px 0 0;border-top:6px solid var(--c);box-shadow:0 -1px 3px rgba(0,0,0,.2);transform:rotate(calc((var(--k) - 1)*2deg))}
.ffront{position:absolute;left:0;right:0;bottom:0;height:118px;border-radius:14px;background:linear-gradient(180deg,rgba(255,255,255,.28),transparent 40%),var(--fc);box-shadow:inset 0 1px 0 rgba(255,255,255,.4);padding:14px;display:flex;flex-direction:column;justify-content:flex-end;color:var(--ft);transform-origin:bottom;transition:transform .2s ease}
.folder:hover .ffront,.folder.sel .ffront,.folder.over .ffront{transform:perspective(500px) rotateX(-14deg)}
.folder.over .fback{outline:3px solid var(--accent);outline-offset:4px}
.ffront .f-title{font-size:16px;font-weight:700}
.fcount{font-size:12px;font-weight:500;opacity:.8;margin-top:2px}
.fan{position:absolute;left:50%;bottom:calc(100% - 26px);padding-bottom:18px;display:flex;justify-content:center;transform:translateX(-50%) translateY(46px) scale(.6);transform-origin:bottom center;opacity:0;pointer-events:none;transition:transform .22s cubic-bezier(.2,.9,.3,1.2),opacity .15s}
.folder:hover .fan,.folder.sel .fan{opacity:1;pointer-events:auto;transform:translateX(-50%)}
.folder.over .fan{opacity:0;pointer-events:none}
.mini{flex:none;width:128px;margin:0 3px;background:#fff;color:var(--ink);border-radius:11px;border-top:7px solid var(--c);padding:9px 10px 10px;box-shadow:0 8px 18px rgba(0,0,0,.28);cursor:grab;
  transform:rotate(calc((var(--i) - (var(--n) - 1)/2)*5deg)) translateY(calc((var(--i) - (var(--n) - 1)/2)*(var(--i) - (var(--n) - 1)/2)*5px));transition:transform .15s}
.mini:hover{transform:translateY(-12px) scale(1.06);z-index:2}
.mini b{display:block;font-size:12.5px;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.mini small{display:block;font-size:10.5px;color:#6e6e73;margin-top:3px}
.fempty{font-size:12px;color:var(--text);background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:6px 12px;white-space:nowrap}


#strings path.s{stroke:#ff453a;stroke-width:2.5;fill:none;filter:drop-shadow(0 2px 1px rgba(0,0,0,.3))}
#strings path.hit{stroke:transparent;stroke-width:8;fill:none;pointer-events:stroke;cursor:pointer}
#strings g:hover path.s{stroke-width:4}
#strings path.tmp{stroke:#ff453a;stroke-width:2.5;stroke-dasharray:6 5;fill:none}
#strings circle{fill:#ff453a;stroke:#fff;stroke-width:1.5}

body.ro #bar,body.ro #hint,body.ro .tools,body.ro #libBtn,body.ro #pager .add{display:none}
body.ro .card,body.ro .f,body.ro #proj,body.ro .mini{cursor:default}
body.ro .stamp{pointer-events:none}
@media (max-width:700px){#bar{top:64px;max-width:calc(100% - 28px)}#hint{top:130px}#next{max-width:calc(100% - 28px);bottom:62px}#toast{bottom:110px}}

/* ---------- v4 additions ---------- */
#menu,#list,#lib,#ctx{z-index:40}
.card{transform:rotate(var(--r,0deg)) scale(var(--s,1));transition:transform .3s cubic-bezier(.3,1.6,.5,1),box-shadow .2s}
.card:hover{--s:1.035}
.card.drag{transition:none;--s:1.05}
.btn,.mi,.srow,#zoom button,#pager button,#menuBtn,#next{transition:transform .18s cubic-bezier(.3,1.6,.5,1),background .15s,filter .15s}
.btn:active,.srow:active,#zoom button:active,#pager button:active:not(:disabled),#menuBtn:active{transform:scale(.94)}
#menuBtn:hover,#next:hover{transform:scale(1.06)}
#next:hover{transform:translateX(-50%) scale(1.04)}

/* dock: icons really change size, so the glass behind them grows too */
#bar{overflow:visible;max-width:none;gap:5px;padding:8px 10px;border-radius:24px;align-items:flex-start;transition:border-radius .1s}
.tool{position:relative;flex:none;min-width:0;width:calc(42px*var(--s,1));height:calc(42px*var(--s,1));padding:0;justify-content:center;border-radius:calc(12px*var(--s,1));transition:background .15s;color:var(--text)}
.tool svg{width:50%;height:50%;stroke-width:1.7}
.tool:hover{background:var(--hover)}
.tool.on{background:var(--accent);color:#fff;box-shadow:0 4px 12px rgba(0,122,255,.4)}
.tool.on::before{content:"";position:absolute;bottom:-6px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--text);opacity:.7}
.tool::after{content:attr(data-label);position:absolute;top:calc(100% + 14px);left:50%;transform:translateX(-50%);background:var(--chip);border:1px solid var(--line);color:var(--text);font-size:11.5px;font-weight:500;padding:4px 10px;border-radius:9px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.tool:hover::after{opacity:1}
#bar .sep{height:30px;margin:6px 3px;align-self:flex-start}
#hint{top:96px}

/* sidebar: a slim rail in the middle of the left edge that opens on hover */
#side{top:50%;left:14px;transform:translateY(-50%);width:56px;padding:8px;border-radius:22px;max-height:calc(100% - 190px);overflow-x:hidden;overflow-y:auto;scrollbar-width:none;
  transition:width .34s cubic-bezier(.3,1.35,.5,1),box-shadow .3s,border-radius .3s}
#side::-webkit-scrollbar{display:none}
#side:hover,#side:focus-within{width:190px;box-shadow:0 18px 50px rgba(0,0,0,.32)}
#side .mh{height:1px;margin:7px 8px;padding:0;background:var(--line);font-size:0;overflow:hidden;transition:all .25s}
#side .mh:first-child{height:0;margin:0}
#side:hover .mh,#side:focus-within .mh{height:16px;margin:8px 8px 3px;background:none;font-size:11.5px}
#side:hover .mh:first-child,#side:focus-within .mh:first-child{margin-top:2px}
.srow{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-radius:12px;padding:5px;font-size:13px;font-weight:500;text-align:left;transform-origin:0 50%;white-space:nowrap}
.srow .tile{flex:none;width:30px;height:30px;border-radius:9px;background:var(--hover);display:grid;place-items:center;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.srow span:not(.tile){opacity:0;transform:translateX(-6px);transition:opacity .2s,transform .3s cubic-bezier(.3,1.35,.5,1)}
#side:hover .srow span:not(.tile),#side:focus-within .srow span:not(.tile){opacity:1;transform:none}
.srow:hover{background:var(--hover)}
.srow:hover .tile{transform:scale(1.18)}
.srow.on{background:var(--accent);color:#fff}
.srow.on .tile{background:rgba(255,255,255,.25)}
.ic.mat{background:#dcbf90}
.ic.cork{background:radial-gradient(circle,rgba(70,40,10,.4) 1px,transparent 1.5px) 0 0/5px 5px,#c0915f}
.ic.paper{background:linear-gradient(rgba(0,90,200,.3) 1px,transparent 1px) 0 0/100% 5px,linear-gradient(90deg,rgba(0,90,200,.3) 1px,transparent 1px) 0 0/5px 100%,#fff}
.ic.white{background:#fff;border:2px solid #c7c7cc}
.ic.all{background:conic-gradient(#dcbf90 0 25%,#c0915f 0 50%,#fff 0 75%,#e9eef7 0)}

/* context menu */
#ctx{display:none;padding:5px;min-width:210px;border-radius:13px}
#ctx.show{display:block;animation:pop .14s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.csep{height:1px;background:var(--line);margin:4px 9px}
.crow{display:flex;gap:7px;padding:7px 9px}
.cdot{width:20px;height:20px;border-radius:50%;border:0;padding:0;background:var(--c);box-shadow:inset 0 0 0 1px rgba(128,128,128,.55);transition:transform .15s}
.cdot:hover{transform:scale(1.25)}

/* sections as objects */
.sec{z-index:1}
.sec.sel{outline:3px solid var(--accent);outline-offset:5px}
.label{cursor:grab;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.label:hover{transform:scale(1.06)}
.sname{min-width:16px;white-space:nowrap;min-height:0}
.rs{position:absolute;right:3px;bottom:3px;width:28px;height:28px;cursor:nwse-resize;border-radius:0 0 18px 0;background:linear-gradient(135deg,transparent 56%,rgba(0,0,0,.3) 56% 62%,transparent 62% 72%,rgba(0,0,0,.3) 72% 78%,transparent 78%)}

/* drawings and text */
svg.layer{position:absolute;left:-6000px;top:-6000px;width:14000px;height:14000px;pointer-events:none;overflow:visible}
#draw{z-index:5}
#strings{z-index:6}
.shp .v{stroke:var(--c,var(--text));stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.shp .hit{stroke:transparent;stroke-width:16;fill:none;pointer-events:stroke;cursor:grab}
.shp.sel .v{filter:drop-shadow(0 0 5px var(--accent))}
#vp.erasing .shp .hit,#vp.erasing .txt{cursor:cell}
.txt{position:absolute;z-index:5;font-size:24px;font-weight:700;letter-spacing:-.01em;line-height:1.2;color:var(--c,var(--text));white-space:pre;padding:2px 8px;border-radius:8px;cursor:grab;min-width:24px;user-select:none;-webkit-user-select:none}
.txt.sel{outline:3px solid var(--accent);outline-offset:2px}
.txt:focus{cursor:text}

body.ro #side,body.ro .rs{display:none}
body.ro .label{cursor:default}
@media (max-width:700px){
  #bar{overflow-x:auto;max-width:calc(100% - 28px);top:64px}
  .tool::after{display:none}
  #hint{display:none}
  #bar{align-items:center}
}
@media (prefers-reduced-motion:reduce){.card,.label,.tool,.srow,.btn{transition:none!important}#ctx.show{animation:none}}

.ffront{background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,0) 55%),var(--fc)}
.fback{filter:brightness(.86) saturate(1.1)}
#right .btn,#zoom,#pager,#next,#menuBtn{border-radius:999px}
#zoom button,#pager button{border-radius:999px}
#menuBtn{width:44px;height:44px}

/* dock background: flat pill that bulges in a curve only under the pointer */
#bar{background:none;border:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;height:58px}
.dockbg{position:absolute;left:0;top:0;width:100%;height:140px;z-index:-1;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);pointer-events:none}
.dockshadow,.dockline{position:absolute;left:0;top:0;width:100%;height:140px;overflow:visible;pointer-events:none}
.dockshadow{z-index:-2}.dockline{z-index:-1}
.dockshadow path{fill:rgba(0,0,0,.3);filter:blur(12px);transform:translateY(8px)}
.dockline path{fill:none;stroke:var(--line);stroke-width:1}
@media (max-width:700px){
  #bar{background:var(--glass);border:1px solid var(--line);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);height:auto}
  .dockbg,.dockshadow,.dockline{display:none}
}

/* cursors win over the cursors set on cards and text while a tool is active */
#vp.hand,#vp.hand *{cursor:grab!important}
#vp.panning,#vp.panning *{cursor:grabbing!important}
#vp.placing *{cursor:crosshair!important}

/* section blueprint that follows the pointer before placing */
#over{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none;z-index:4}
.gwrap{position:absolute;display:none}
.gwrap.show{display:block}
.ghost{position:absolute;border:2px dashed var(--accent);border-radius:26px;
  background:
    linear-gradient(rgba(10,132,255,.16) 1px,transparent 1px) 0 0/28px 28px,
    linear-gradient(90deg,rgba(10,132,255,.16) 1px,transparent 1px) 0 0/28px 28px,
    rgba(10,132,255,.07);
  box-shadow:0 0 0 6px rgba(10,132,255,.08),inset 0 0 50px rgba(10,132,255,.14);
  animation:holo 1.6s ease-in-out infinite}
.ghost::before,.ghost::after{content:"";position:absolute;left:50%;top:50%;background:var(--accent);opacity:.6}
.ghost::before{width:22px;height:2px;margin:-1px 0 0 -11px}
.ghost::after{width:2px;height:22px;margin:-11px 0 0 -1px}
.gtag{position:absolute;left:16px;top:14px;display:flex;align-items:baseline;gap:8px;background:var(--accent);color:#fff;font-size:14px;font-weight:600;padding:5px 12px;border-radius:999px;box-shadow:0 4px 14px rgba(0,122,255,.35)}
.gtag small{font-size:11.5px;font-weight:500;opacity:.85;font-variant-numeric:tabular-nums}
@keyframes holo{0%,100%{opacity:.75}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.ghost{animation:none}}

/* theme switch */
#themeBtn{width:42px;padding:0;display:grid;place-items:center}
#themeBtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;grid-area:1/1;transition:transform .45s cubic-bezier(.3,1.5,.5,1),opacity .25s}
#themeBtn .moon{opacity:0;transform:rotate(-90deg) scale(.5)}
#themeBtn.dark .sun{opacity:0;transform:rotate(90deg) scale(.5)}
#themeBtn.dark .moon{opacity:1;transform:none}
html.tswap *{transition:background-color .35s,color .35s,border-color .35s,fill .35s,stroke .35s!important}

/* menus and panels sit over busy surfaces, so they get a denser glass that keeps its own colour */
#ctx,#menu,#lib,#list{background:var(--glass-strong)}
.fempty{background:var(--glass-strong)}
:root{--glass-strong:rgba(250,250,252,.94)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--glass-strong:rgba(40,40,43,.95)}}
:root[data-theme="dark"]{--glass-strong:rgba(40,40,43,.95)}

/* desk colours from the reference, no dots */
:root{--desk:#f1f1f1;--group:rgba(0,0,0,.045)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--desk:#444444;--muted:#bcbcc1;--group:rgba(255,255,255,.06)}}
:root[data-theme="dark"]{--desk:#444444;--muted:#bcbcc1;--group:rgba(255,255,255,.06)}
#vp{background:var(--desk)}
#vp:focus{outline:none}

/* theme button: the generic .btn padding was squeezing the icon off-centre */
#right #themeBtn{width:42px;height:42px;padding:0;display:grid;place-items:center}

/* menu button morphs into a close mark */
#menuBtn .burger{position:relative;width:18px;height:14px;display:block}
#menuBtn .burger i{position:absolute;left:0;width:18px;height:2px;border-radius:2px;background:var(--text);transition:transform .35s cubic-bezier(.3,1.4,.5,1),opacity .2s,top .35s cubic-bezier(.3,1.4,.5,1)}
#menuBtn .burger i:nth-child(1){top:0}#menuBtn .burger i:nth-child(2){top:6px}#menuBtn .burger i:nth-child(3){top:12px}
#menuBtn.open .burger i:nth-child(1){top:6px;transform:rotate(45deg)}
#menuBtn.open .burger i:nth-child(2){opacity:0;transform:scaleX(.2)}
#menuBtn.open .burger i:nth-child(3){top:6px;transform:rotate(-45deg)}

/* top-left menu: grouped like iOS settings, opens from the button */
#menu{display:block;width:300px;padding:10px;border-radius:20px;top:66px;max-height:calc(100% - 150px);
  opacity:0;visibility:hidden;transform:scale(.9) translateY(-8px);transform-origin:22px -12px;filter:blur(6px);
  transition:opacity .18s,transform .3s cubic-bezier(.3,1.35,.5,1),filter .2s,visibility 0s .3s}
#menu.show{opacity:1;visibility:visible;transform:none;filter:none;transition:opacity .2s,transform .42s cubic-bezier(.3,1.35,.5,1),filter .25s,visibility 0s}
.mhead{display:flex;align-items:center;gap:11px;padding:6px 8px 12px}
.mhead .app{width:38px;height:38px;border-radius:10px;flex:none;background:linear-gradient(145deg,#4ab3f8,#0a64ff);display:grid;place-items:center;box-shadow:0 4px 12px rgba(10,100,255,.35)}
.mhead .app svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mhead b{display:block;font-size:15px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:210px}
.mhead small{font-size:12px;color:var(--muted)}
#menu .mh{margin:6px 10px 5px;font-size:11.5px;font-weight:600;color:var(--muted);text-transform:none}
.mgroup{background:var(--group);border-radius:14px;padding:4px;margin-bottom:6px}
#menu .mi{gap:11px;padding:6px 8px;border-radius:10px;font-size:13.5px;font-weight:500;
  opacity:0;transform:translateY(7px);transition:opacity .22s,transform .4s cubic-bezier(.3,1.4,.5,1),background .12s,color .12s}
#menu.show .mi{opacity:1;transform:none;transition-delay:calc(var(--i,0)*24ms),calc(var(--i,0)*24ms),0s,0s}
#menu .mi:hover{background:var(--accent);color:#fff}
#menu .mi:active{transform:scale(.97)}
#menu .mi.del{color:var(--red)}
#menu .mi.del:hover{background:var(--red);color:#fff}
#menu .mi.off{pointer-events:none}
#menu.show .mi.off{opacity:.38}
.mic{width:28px;height:28px;border-radius:8px;background:var(--c);display:grid;place-items:center;flex:none;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.15);transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.mic svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
#menu .mi:hover .mic{transform:scale(1.1) rotate(-4deg)}
.mi kbd{margin-left:auto;font:500 11.5px var(--body);color:var(--muted);background:none}
#menu .mi:hover kbd{color:rgba(255,255,255,.8)}
#menu .mi.cur::after{content:"\2713";margin-left:auto;font-weight:700;color:var(--accent)}
#menu .mi.cur:hover::after{color:#fff}
@media (prefers-reduced-motion:reduce){#menu,#menu .mi,#menuBtn .burger i{transition:none!important}}

/* ---------- smart link cards ---------- */
.t-link,.t-media{background:#fff;padding:10px 10px 12px;border-radius:16px}
.lhead{display:flex;align-items:center;gap:7px;margin:0 2px 9px;font-size:12px;white-space:nowrap}
.lhead b{font-weight:700;letter-spacing:-.01em}
.lhead span{color:#6e6e73;overflow:hidden;text-overflow:ellipsis}
.pdot{width:16px;height:16px;border-radius:5px;background:var(--pb);flex:none;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.2)}
.lopen{margin-left:auto;font-weight:600;color:#0066d6;text-decoration:none;padding:3px 8px;border-radius:999px;background:rgba(0,102,214,.09);flex:none}
.lopen:hover{background:#0066d6;color:#fff}
.lframe{position:relative;border-radius:11px;overflow:hidden;background:var(--pb);margin-bottom:9px;color:#fff;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.25)}
.lframe img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.lframe::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.28),transparent 30%,transparent 62%,rgba(0,0,0,.55));pointer-events:none}
.pplay{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(255,255,255,.22);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.35);z-index:1;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.pplay::before{content:"";position:absolute;left:18px;top:14px;border:9px solid transparent;border-left:14px solid #fff;border-right:0}
.t-link:hover .pplay{transform:scale(1.12)}
.lkind,.lstart,.lid{position:absolute;z-index:1;font-size:11px;font-weight:600}
.lkind{left:9px;top:8px;padding:3px 8px;border-radius:999px;background:rgba(0,0,0,.35);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.lstart{right:9px;top:8px;padding:3px 8px;border-radius:999px;background:#fff;color:#1d1d1f}
.lid{left:10px;right:10px;bottom:8px;font:500 11px var(--mono);opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lhint{position:absolute;left:12px;right:12px;bottom:30px;z-index:1;font-size:10.5px;line-height:1.3;opacity:0;text-align:center;transition:opacity .2s}
.t-link.sel .lhint{opacity:.8}
.lempty{border:2px dashed #c7c7cc;border-radius:12px;padding:16px 12px;margin-bottom:6px;display:grid;gap:6px;text-align:center}
.lempty .f-url{font:500 13px var(--body);color:#1d1d1f;text-align:left}
.lempty small{font-size:11px;color:#8e8e93}
.xpost{border:1px solid #e5e5ea;border-radius:12px;padding:11px 12px;margin-bottom:9px}
.xthumb{display:block;width:100%;border-radius:8px;margin-bottom:9px}
.xwho{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.xwho b{font-size:13.5px}
.xav{width:28px;height:28px;border-radius:50%;background:var(--pb);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.xpost .f-note{font-size:13.5px;opacity:1;line-height:1.4}
.t-link .f-title,.t-media .f-title{margin:0 2px}
.notes{display:grid;gap:4px;margin:8px 2px 0}
.nrow{display:flex;align-items:flex-start;gap:6px;font-size:12.5px}
.tc{flex:none;border:0;border-radius:6px;background:rgba(255,55,95,.12);color:#c4002b;font:600 11.5px var(--mono);padding:2px 6px;min-width:34px;text-align:center}
.t-media .tc{background:rgba(94,92,230,.13);color:#4a48c9}
button.tc:hover{background:#5e5ce6;color:#fff}
.tgo{flex:none;color:#c4002b;text-decoration:none;font-weight:700;padding:1px 3px;border-radius:5px}
.tgo:hover{background:rgba(255,55,95,.12)}
.ntext{flex:1;min-width:0;opacity:.85;padding-top:1px}
.nrm{flex:none;border:0;background:none;color:#8e8e93;font-size:15px;line-height:1;padding:0 2px;opacity:0;transition:opacity .15s}
.nrow:hover .nrm{opacity:1}
.addn{justify-self:start;border:0;background:none;color:#0066d6;font-size:12px;font-weight:600;padding:3px 0}
.addn:hover{text-decoration:underline}
.card:not(.sel):not(:hover) .addn{display:none}
.cres{position:absolute;right:4px;bottom:4px;width:18px;height:18px;cursor:nwse-resize;opacity:0;transition:opacity .15s;
  background:linear-gradient(135deg,transparent 50%,rgba(0,0,0,.28) 50% 58%,transparent 58% 70%,rgba(0,0,0,.28) 70% 78%,transparent 78%)}
.card:hover .cres,.card.sel .cres{opacity:1}

/* ---------- clips you can study ---------- */
.vwrap{position:relative;border-radius:11px;overflow:hidden;background:#000;margin-bottom:8px}
.vwrap video,.vwrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.vslot{position:absolute;inset:0}
.vbig{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(255,255,255,.22);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.35);pointer-events:none;transition:opacity .2s,transform .3s cubic-bezier(.3,1.6,.5,1)}
.vbig::before{content:"";position:absolute;left:20px;top:16px;border:10px solid transparent;border-left:15px solid #fff;border-right:0}
.t-media.playing .vbig{opacity:0;transform:scale(.7)}
.vmiss{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:12px;color:#d1d1d6;font-size:12px;line-height:1.4}
.vctl{display:flex;align-items:center;gap:4px;margin:0 2px 4px}
.vctl button{border:0;background:#f2f2f7;color:#1d1d1f;border-radius:8px;height:26px;min-width:26px;font-size:15px;line-height:1;display:grid;place-items:center;padding:0 7px;transition:transform .15s cubic-bezier(.3,1.6,.5,1),background .15s}
.vctl button:hover{background:#e5e5ea}
.vctl button:active{transform:scale(.9)}
.vctl .vp{background:#5e5ce6;min-width:30px}
.vctl .vp i{display:block;border:6px solid transparent;border-left:9px solid #fff;border-right:0;margin-left:3px}
.t-media.playing .vctl .vp i{width:9px;height:11px;border:0;margin:0;background:linear-gradient(90deg,#fff 0 3px,transparent 3px 6px,#fff 6px)}
.vtime{font:500 11.5px var(--mono);color:#48484a;margin:0 0 0 auto;white-space:nowrap;font-variant-numeric:tabular-nums}
.vchip{font:600 11px var(--body)!important}
.vchip.on{background:#5e5ce6!important;color:#fff!important}
.vrow2{display:flex;align-items:center;gap:4px;margin:2px 2px 8px}
.vrow2 .vscrub{flex:1;min-width:0;accent-color:#5e5ce6;height:4px;margin:0 4px 0 0}
.vrow2 button{border:0;background:#f2f2f7;color:#1d1d1f;border-radius:8px;height:24px;padding:0 7px;flex:none;transition:transform .15s cubic-bezier(.3,1.6,.5,1),background .15s}
.vrow2 button:hover{background:#e5e5ea}.vrow2 button:active{transform:scale(.9)}
.sess{font-size:11px;color:#b25000;margin:3px 2px 0}
#vp.dropping::after{content:"Drop to add it to the board";position:absolute;inset:14px;border:2px dashed var(--accent);border-radius:24px;background:rgba(10,132,255,.07);display:grid;place-items:center;font-size:18px;font-weight:600;color:var(--accent);pointer-events:none;z-index:25}
.ic.link{background:linear-gradient(150deg,#fdc468,#d62976 55%,#4f5bd5)}

/* live players inside link cards */
.lframe[data-play]{cursor:pointer}
.lframe.live{background:#000}
.fslot{position:absolute;inset:0}
.fslot iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#000}
.lclose{position:absolute;right:8px;top:8px;z-index:3;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:17px;line-height:1;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.lclose:hover{transform:scale(1.12);background:rgba(0,0,0,.75)}
.t-link.sel .lframe.live,.t-link .lframe.live{cursor:default}
.xlive{position:relative;height:420px;padding:0;overflow:hidden}
.xshow{display:block;width:100%;margin:2px 0 8px;border:0;border-radius:9px;background:#f2f2f7;color:#1d1d1f;font-size:12.5px;font-weight:600;padding:7px}
.xshow:hover{background:#e5e5ea}
.lframe img{z-index:0}

/* update pill */
#updPill{left:50%;top:82px;transform:translate(-50%,-14px) scale(.92);opacity:0;pointer-events:none;display:flex;align-items:center;gap:8px;padding:8px 8px 8px 14px;border-radius:999px;font-size:13px;font-weight:500;
  transition:opacity .25s,transform .45s cubic-bezier(.3,1.5,.5,1)}
#updPill.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#updPill i{width:8px;height:8px;border-radius:50%;background:#30d158;box-shadow:0 0 0 4px rgba(48,209,88,.2)}
#updPill b{background:var(--accent);color:#fff;border-radius:999px;padding:4px 11px;font-weight:600}
#updPill:hover b{filter:brightness(1.1)}
</style>
</head>
<body>

function parseLink(raw){

    else if(seg[0]&&seg[0][0]==="@"){r.kind="Channel";r.handle=seg[0];r.ar="1/1";r.w=230}
    else {r.kind="Video";r.vid=url.searchParams.get("v")||""}}
  else if(/(^|\.)instagram\.com$/.test(h)){r.plat="ig";
    var i=seg.indexOf("reel")>=0?seg.indexOf("reel"):seg.indexOf("reels")>=0?seg.indexOf("reels"):seg.indexOf("tv");

function linkAt(c,sec){

function build(key){
  var t=TPL[key], cnt={}, inF={};
  t.folders.forEach(function(f,fi){f.items.forEach(function(i){inF[i]=fi})});
  var cards=t.cards.map(function(r,i){
    var c={id:nid("c"),type:r[1],title:r[2],detail:r[3],note:r[4],loc:r[5],status:r[6],x:0,y:0};
    if(inF[i]===undefined){var n=cnt[r[0]]||0;cnt[r[0]]=n+1;var p=slot(r[0],n);c.x=p.x;c.y=p.y}
    return c;
  });
  var links=t.links.map(function(l){return [cards[l[0]].id,cards[l[1]].id]});
  t.folders.forEach(function(f){
    var n=cnt[f.sec]||0;cnt[f.sec]=n+1;var p=slot(f.sec,n);
    var fo={id:nid("c"),type:"folder",title:f.name,color:f.color,x:p.x-10,y:p.y+20};
    f.items.forEach(function(i){cards[i].in=fo.id;cards[i].x=fo.x;cards[i].y=fo.y});

function bounds(){
  var b=[1e9,1e9,-1e9,-1e9], add=function(x,y,w,h){b[0]=Math.min(b[0],x);b[1]=Math.min(b[1],y);b[2]=Math.max(b[2],x+w);b[3]=Math.max(b[3],y+h)};
  P.secs.forEach(function(s){add(s.x,s.y-30,s.w,s.h+30)});
  P.cards.forEach(function(c){if(!c.in)add(c.x,c.y,cw(c),c.w?c.w*1.9:200)});
  P.shapes.forEach(function(s){if(s.kind==="text")add(s.x,s.y,200,40);else if(s.kind==="draw")s.pts.forEach(function(p){add(p[0],p[1],0,0)});else{add(s.x1,s.y1,0,0);add(s.x2,s.y2,0,0)}});
  return b[0]>b[2]?null:b;
}
function fit(){
  var w=vp.clientWidth,h=vp.clientHeight,b=bounds(),side=w>700?190:60;
  if(!b){z=1;tx=side+40;ty=110;applyView();return}
  b[1]=Math.min(b[1],20);b[0]=Math.min(b[0],36);
  var bw=b[2]-b[0]+60,bh=b[3]-b[1]+40;
  z=Math.max(.25,Math.min(1,Math.min((w-side-20)/bw,(h-170)/bh)));
  tx=side+(w-side-bw*z)/2-(b[0]-30)*z; ty=96-(b[1])*z+Math.max(0,(h-170-bh*z)/2); applyView();
}

  for(var x=W-r-2;x>r;x-=2)p+="L"+x.toFixed(1)+" "+(H+E*bump(x-lx,190)).toFixed(1);
  return p+"L"+r+" "+yL.toFixed(1)+"A"+r+" "+r+" 0 0 1 0 "+(yL-r).toFixed(1)+"V"+r+"A"+r+" "+r+" 0 0 1 "+r+" 0Z";

$("zIn").addEventListener("click",function(){zoomAt(1.2,vp.clientWidth/2,vp.clientHeight/2)});
$("zOut").addEventListener("click",function(){zoomAt(1/1.2,vp.clientWidth/2,vp.clientHeight/2)});
$("fitBtn").addEventListener("click",fit);
$("fitBtn2").addEventListener("click",function(){fit();$("menu").classList.remove("show")});
$("next").addEventListener("click",function(){if(this.dataset.id)jump(this.dataset.id)});
$("pPrev").addEventListener("click",function(){goPage(S.cur-1)});
$("pNext").addEventListener("click",function(){goPage(S.cur+1)});
$("pAdd").addEventListener("click",addPage);
$("addPage2").addEventListener("click",addPage);
$("delPage").addEventListener("click",function(){
  if(S.pages.length<2){toast("This is the only page, so it stays.");return}
  ask("Delete page "+(S.cur+1)+(P.name?" ("+P.name+")":"")+" and everything on it?","Delete page",function(){
    S.pages.splice(S.cur,1);S.cur=Math.max(0,S.cur-1);P=S.pages[S.cur];sel=null;render()});
});
[].slice.call($("menu").querySelectorAll(".mi")).forEach(function(b,i){b.style.setProperty("--i",i)});
function menuOpen(on){$("menu").classList.toggle("show",on);$("menuBtn").classList.toggle("open",on);$("menuBtn").setAttribute("aria-expanded",on);if(!on)$("confirm").classList.remove("show")}
new MutationObserver(function(){var on=$("menu").classList.contains("show");$("menuBtn").classList.toggle("open",on);$("menuBtn").setAttribute("aria-expanded",on)}).observe($("menu"),{attributes:true,attributeFilter:["class"]});
$("menuBtn").addEventListener("click",function(){$("list").classList.remove("show");menuOpen(!$("menu").classList.contains("show"))});
$("undoBtn").addEventListener("click",function(){undo()});
$("redoBtn").addEventListener("click",function(){redo()});
$("menu").addEventListener("click",function(e){
  var b=e.target.closest("[data-tpl]"); if(!b)return; var key=b.dataset.tpl;
  var go=function(){S.pages[S.cur]=P=build(key);sel=null;render();fit()};
  if(!P.cards.length&&!P.secs.length&&!P.shapes.length){go();$("menu").classList.remove("show");return}
  ask("Replace everything on this page with "+TPL[key].label+"? Other pages and your asset library stay.","Replace this page",go);
});
$("confirmYes").addEventListener("click",function(){var fn=pending;pending=null;$("confirm").classList.remove("show");$("menu").classList.remove("show");if(fn)fn()});
$("confirmNo").addEventListener("click",function(){pending=null;$("confirm").classList.remove("show")});

function renderList(){
  var h='<div class="rowb" style="justify-content:space-between;margin:2px 6px 4px"><b>Checklist</b><button class="btn" type="button" data-x>Close</button></div>', o=ordered();
  P.secs.concat([{id:null,name:"Loose on the page"}]).forEach(function(s){
    var cs=o.filter(function(c){return secOf(c)===s.id}); if(!cs.length)return;
    h+='<div class="mh">'+esc(s.name)+'</div>';
    cs.forEach(function(c){h+='<div class="li'+(isDone(c)?' d':'')+'"><input type="checkbox" id="ck-'+c.id+'" data-ck="'+c.id+'"'+(isDone(c)?' checked':'')+(ro()?' disabled':'')+' aria-label="Done"><button type="button" data-go="'+c.id+'">'+esc(c.title||TYPES[c.type].label)+(c.in?" (in folder)":"")+'</button></div>'});
  });
  if(!o.length)h+='<div class="mh">Nothing on this page yet</div>';
  $("list").innerHTML=h;
}
$("listBtn").addEventListener("click",function(){$("menu").classList.remove("show");$("list").classList.add("show");renderList()});
$("list").addEventListener("click",function(e){
  if(e.target.closest("[data-x]")){$("list").classList.remove("show");return}
  var g=e.target.closest("[data-go]"); if(g)jump(g.dataset.go);
});
$("list").addEventListener("change",function(e){var id=e.target.dataset.ck;if(!id)return;var c=card(id);c.status=e.target.checked?TYPES[c.type].st.length-1:0;render()});

function renderLib(){
  var h='<div class="rowb" style="justify-content:space-between;margin:2px 6px 6px"><b>Asset library</b><button class="btn" type="button" data-x>Close</button></div>';
  h+=S.library.map(function(a,i){return '<div class="libitem"><div><b>'+esc(a.name)+'</b><small>'+esc(a.kind)+(a.loc?" &rarr; "+esc(a.loc):"")+'</small></div><button class="btn" type="button" data-pin="'+i+'">Add to page</button></div>'}).join("");
  h+='<div class="libadd"><div class="mh" style="margin:6px 0 0">Add an asset once, reuse it on every page</div>'+
    '<input id="l-name" placeholder="Asset name" maxlength="60" aria-label="Asset name">'+
    '<select id="l-kind" aria-label="Kind"><option>SFX</option><option>Music</option><option>Overlay</option><option>Preset</option><option>Font</option><option>Graphic</option><option>Project file</option></select>'+
    '<input id="l-loc" placeholder="Paste a link or type a file name" aria-label="Link or file name">'+
    '<div class="rowb" style="margin:0"><button class="btn" type="button" data-lfile>Pick a file</button><button class="btn pri" type="button" data-ladd>Add to library</button></div><input type="file" id="l-file" hidden></div>';
  $("lib").innerHTML=h;
}
$("libBtn").addEventListener("click",function(){var l=$("lib");l.classList.toggle("show");if(l.classList.contains("show"))renderLib()});
$("lib").addEventListener("click",function(e){
  var t=e.target;
  if(t.closest("[data-x]")){$("lib").classList.remove("show");return}
  if(t.closest("[data-lfile]")){$("l-file").click();return}
  if(t.closest("[data-ladd]")){var n=$("l-name").value.trim();if(!n){toast("Give the asset a name first.");$("l-name").focus();return}
    S.library.push({name:n,kind:$("l-kind").value,loc:$("l-loc").value.trim()});save();renderLib();return}
  var p=t.closest("[data-pin]");
  if(p){var a=S.library[+p.dataset.pin], k=P.cards.length%6, w=center();
    var c={id:nid("c"),type:"asset",title:a.name,detail:a.kind,note:"",loc:a.loc,status:a.loc?1:0,x:Math.round(w.x-CW/2+k*22),y:Math.round(w.y-80+k*22)};
    P.cards.push(c);sel=c.id;render();toast(a.name+" is on the page. Tie it to a beat when you know where it goes.")}
});
$("lib").addEventListener("change",function(e){
  if(e.target.id==="l-file"&&e.target.files[0]){var f=e.target.files[0];$("l-loc").value=fileLabel(f);if(!$("l-name").value)$("l-name").value=f.name.replace(/\.[^.]+$/,"")}
});
$("roBtn").addEventListener("click",function(){
  var on=document.body.classList.toggle("ro"); this.textContent=on?"Back to editing":"Client view"; this.setAttribute("aria-pressed",on);
  tying=null;sel=null;setTool("select");$("lib").classList.remove("show");render();
  if(on)toast("This is what a client would see. Nothing can be changed.");
});
window.addEventListener("resize",applyView);

load(); S.pages.forEach(function(pg){pg.cards.forEach(function(c){if(c.playing)c.playing=false})}); hist.cur=JSON.stringify(S); render(); fit(); drawDock();
setTimeout(function(){$("hint").style.display="none"},7000);
})();
</script>
</body>
</html>
